- id: mutants
  name: mutants
  description: Run mutation testing on the crate with cargo-mutants
  stages:
    - pre-push
  entry: cargo mutants
  language: rust
  additional_dependencies:
    - "cli:cargo-mutants:27.1.0"
  types: [rust]
  pass_filenames: false

- id: audit
  name: audit
  description: Run public vulnerability auditing with cargo-audit
  stages:
    - pre-push
  entry: cargo audit
  language: rust
  additional_dependencies:
    - "cli:cargo-audit:0.22.2"
  types: [rust]
  pass_filenames: false

- id: tarpaulin
  name: tarpaulin
  description: Run code coverage analysis with cargo-tarpaulin
  stages:
    - pre-push
  entry: cargo tarpaulin
  language: rust
  additional_dependencies:
    - "cli:cargo-tarpaulin:0.37.0"
  types: [rust]
  pass_filenames: false

- id: cargo-fmt
  name: cargo fmt
  description: Format files with cargo-fmt.
  stages:
    - pre-commit
  entry: cargo fmt
  language: rust
  types: [rust]
  args: ["--"]

- id: clippy-fix
  name: clippy --fix --allow-dirty
  description: Lint rust sources using cargo-clippy and apply fixes.
  stages:
    - pre-commit
  entry: cargo clippy
  language: rust
  types: [rust]
  pass_filenames: false
  require_serial: true
  args: ["--fix", "--allow-dirty"]

- id: cargo-fix
  name: cargo fix --allow-staged
  description: Check the crate for errors and apply fixes.
  stages:
    - pre-commit
  entry: cargo fix
  language: rust
  types: [rust]
  pass_filenames: false
  require_serial: true
  args: ["--allow-staged"]
