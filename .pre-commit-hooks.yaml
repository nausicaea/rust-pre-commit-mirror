- id: cargo-fmt-check
  name: cargo fmt --check
  description: Verify formatting with cargo-fmt.
  stages:
    - pre-push
  entry: cargo fmt
  language: rust
  types: [rust]
  args: ["--check", "--"]

- id: cargo-check
  name: cargo check
  description: Check the crate for errors.
  stages:
    - pre-push
  entry: cargo check
  language: rust
  types: [rust]
  pass_filenames: false

- id: cargo-test
  name: cargo test
  description: Run all tests in the crate.
  stages:
    - pre-push
  entry: cargo test
  language: rust
  types: [rust]
  pass_filenames: false

- id: clippy
  name: clippy
  description: Lint rust sources using cargo-clippy.
  stages:
    - pre-push
  entry: cargo clippy
  language: rust
  types: [rust]
  pass_filenames: false

