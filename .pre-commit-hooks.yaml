- id: cargo-fmt
  name: cargo fmt
  description: Format files with cargo-fmt.
  entry: cargo fmt
  language: rust
  types: [rust]
  args: ["--"]

- id: cargo-check
  name: cargo check
  description: Check the crate for errors.
  entry: cargo check
  language: rust
  types: [rust]
  pass_filenames: false

- id: cargo-test
  name: cargo test
  description: Run all tests in the crate.
  entry: cargo test
  language: rust
  types: [rust]
  pass_filenames: false

- id: clippy
  name: clippy
  description: Lint rust sources using cargo-clippy.
  entry: cargo clippy
  language: rust
  types: [rust]
  pass_filenames: false

- id: clippy-fix
  name: clippy --fix --allow-dirty
  description: Lint rust sources using cargo-clippy and apply fixes.
  entry: cargo clippy
  language: rust
  types: [rust]
  pass_filenames: false
  require_serial: true
  args: ["--fix", "--allow-dirty"]
  stages: [manual]

- id: cargo-fix
  name: cargo fix --allow-staged
  description: Check the crate for errors and apply fixes.
  entry: cargo fix
  language: rust
  types: [rust]
  pass_filenames: false
  require_serial: true
  args: ["--allow-staged"]
  stages: [manual]
