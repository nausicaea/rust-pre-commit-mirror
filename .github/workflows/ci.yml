name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-hooks:
    name: Test ${{ matrix.hook.id }} (${{ matrix.hook.stage }})
    strategy:
      fail-fast: false
      matrix:
        hook:
          - { id: cargo-fmt,        stage: pre-commit }
          - { id: clippy-fix,       stage: pre-commit }
          - { id: cargo-fix,        stage: pre-commit }
          - { id: cargo-fmt-check,  stage: pre-push   }
          - { id: cargo-check,      stage: pre-push   }
          - { id: cargo-test,       stage: pre-push   }
          - { id: clippy,           stage: pre-push   }
          - { id: mutants,          stage: pre-push   }
          - { id: audit,            stage: pre-push   }
          - { id: tarpaulin,        stage: pre-push   }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          cache: false

      - name: Cache prek environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ matrix.hook.id }}-${{ hashFiles('.pre-commit-hooks.yaml') }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.hook.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.hook.id }}-

      - name: Run hook with prek try-repo
        run: |
          prek try-repo . ${{ matrix.hook.id }} \
            --hook-stage ${{ matrix.hook.stage }} \
            --all-files \
            --verbose
