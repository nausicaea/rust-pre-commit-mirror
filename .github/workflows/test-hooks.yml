name: Test Pre-Commit Hooks

on:
  push:
  pull_request:

jobs:
  test-hooks:
    name: Test ${{ matrix.hook.id }} (${{ matrix.hook.stage }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hook:
          - { id: cargo-fmt,        stage: pre-commit }
          - { id: clippy-fix,       stage: pre-commit }
          - { id: cargo-fix,        stage: pre-commit }
          - { id: cargo-fmt-check,  stage: pre-push   }
          - { id: cargo-check,      stage: pre-push   }
          - { id: cargo-test,       stage: pre-push   }
          - { id: clippy,           stage: pre-push   }
          - { id: mutants,          stage: pre-push   }
          - { id: audit,            stage: pre-push   }
          - { id: tarpaulin,        stage: pre-push   }

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.hook.id }}-${{ hashFiles('.pre-commit-hooks.yaml') }}

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.hook.id }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.hook.id }}-

      - name: Run hook with pre-commit try-repo
        run: |
          pre-commit try-repo . ${{ matrix.hook.id }} \
            --hook-stage ${{ matrix.hook.stage }} \
            --all-files \
            --verbose
